# Partmov media edge — auth_request + MinIO proxy with cache
proxy_cache_path /var/cache/nginx/media levels=1:2 keys_zone=media_cache:50m
                 max_size=20g inactive=7d use_temp_path=off;

upstream partmov_api {
  server api:8080;
}

upstream minio_renditions {
  server minio:9000;
}

server {
  listen 80;
  server_name _;

  # Strip viewer identity from cache key after auth — shared segment hits across room viewers.
  proxy_cache_key "$uri";

  location = /internal/media-auth {
    internal;
    proxy_pass http://partmov_api/internal/media-auth;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header Cookie $http_cookie;
  }

  location /media/ {
    auth_request /internal/media-auth;
    auth_request_set $auth_status $upstream_status;

    rewrite ^/media/(.*)$ /renditions/$1 break;
    proxy_pass http://minio_renditions;
    proxy_set_header Host minio:9000;
    proxy_set_header Authorization "";
    # MinIO path-style; credentials injected via nginx subrequest alternative in prod.
    # Dev compose uses API /media/* streaming when edge MinIO anonymous is disabled.
    # Fallback: proxy to API media handler which applies auth + streams.
  }

  # Authoritative private delivery path (always authorized via API)
  location /hls/ {
    auth_request /internal/media-auth;
    rewrite ^/hls/(.*)$ /media/$1 break;
    proxy_pass http://partmov_api;
    proxy_http_version 1.1;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;

    proxy_cache media_cache;
    proxy_cache_valid 200 1d;
    proxy_cache_valid 200 301 302 1m;
    # Manifests: short TTL + SWR
    set $cache_control "public, max-age=86400, immutable";
    if ($uri ~* "\.m3u8$") {
      set $cache_control "private, max-age=3, stale-while-revalidate=10";
      proxy_cache_valid 200 3s;
    }
    add_header Cache-Control $cache_control;
    add_header X-Cache-Status $upstream_cache_status;
    proxy_hide_header Set-Cookie;
    proxy_ignore_headers Set-Cookie;

    # Range support for seeking
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;
  }

  location /healthz {
    return 200 'ok';
    add_header Content-Type text/plain;
  }
}
