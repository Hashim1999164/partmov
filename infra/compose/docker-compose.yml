services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: partmov
      POSTGRES_PASSWORD: partmov
      POSTGRES_DB: partmov
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U partmov"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: partmov
      MINIO_ROOT_PASSWORD: partmovsecret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  createbuckets:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 partmov partmovsecret;
      mc mb -p local/originals || true;
      mc mb -p local/renditions || true;
      mc anonymous set none local/originals;
      mc anonymous set none local/renditions;
      exit 0;
      "

  api:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.api
    profiles: ["stack"]
    environment:
      DATABASE_URL: postgres://partmov:partmov@postgres:5432/partmov
      REDIS_URL: redis://valkey:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: partmov
      MINIO_SECRET_KEY: partmovsecret
      MEDIA_PUBLIC_BASE: http://localhost:8088/media
      PUBLIC_APP_URL: http://localhost:3000
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      minio:
        condition: service_healthy

  sync:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.sync
    profiles: ["stack"]
    environment:
      DATABASE_URL: postgres://partmov:partmov@postgres:5432/partmov
      REDIS_URL: redis://valkey:6379
      SYNC_PORT: 8090
      MEDIA_PUBLIC_BASE: http://localhost:8088/media
    ports:
      - "8090:8090"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

  worker:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.worker
    profiles: ["stack"]
    environment:
      DATABASE_URL: postgres://partmov:partmov@postgres:5432/partmov
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: partmov
      MINIO_SECRET_KEY: partmovsecret
      WORKER_CONCURRENCY: 1
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  media-edge:
    image: nginx:1.27-alpine
    profiles: ["stack"]
    ports:
      - "8088:80"
    volumes:
      - ../nginx/media-edge.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["obs"]
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.3.0
    profiles: ["obs"]
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: partmov
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro

  loki:
    image: grafana/loki:3.2.1
    profiles: ["obs"]
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"

volumes:
  pgdata:
  miniodata:
